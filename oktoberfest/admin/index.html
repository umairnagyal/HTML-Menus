<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestione menù · Birreria Oktoberfest</title>
  <meta name="theme-color" content="#b00101">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <noscript><div class="noscript">Il pannello richiede JavaScript.</div></noscript>

  <!-- ===== Schermata accesso / prima configurazione ===== -->
  <div class="auth" id="authScreen" hidden>
    <div class="auth__card">
      <img class="auth__logo" src="../assets/img/logo-card.webp" alt="Birreria Oktoberfest" width="941" height="840">
      <h1 class="auth__title" id="authTitle">Gestione menù</h1>
      <p class="auth__sub" id="authSub">Inserisci la password per entrare.</p>
      <form id="authForm" autocomplete="on" novalidate>
        <label class="field">
          <span id="authPwLabel">Password</span>
          <input type="password" id="authPw" required minlength="8" autocomplete="current-password" placeholder="••••••••">
        </label>
        <label class="field" id="authPw2Wrap" hidden>
          <span>Ripeti la password</span>
          <input type="password" id="authPw2" minlength="8" autocomplete="new-password" placeholder="••••••••">
        </label>
        <p class="auth__err" id="authErr" role="alert" hidden></p>
        <button class="btn btn--primary btn--block" type="submit" id="authBtn">Entra</button>
      </form>
      <p class="auth__foot"><a href="../" target="_blank" rel="noopener">Apri il menù pubblico ↗</a></p>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div class="app" id="app" hidden>
    <header class="bar">
      <div class="bar__brand">
        <img src="../assets/img/wordmark.webp" alt="Birreria Oktoberfest" width="600" height="225">
        <span class="bar__label">Gestione menù</span>
      </div>
      <div class="bar__status" id="barStatus"></div>
      <div class="bar__actions">
        <a class="btn btn--ghost btn--icon-text" id="previewBtn" href="../?draft=1" target="_blank" rel="noopener" title="Anteprima della bozza">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>Anteprima</span>
        </a>
        <button class="btn btn--primary btn--icon-text" id="publishBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M7 8l5-5 5 5"/></svg><span>Pubblica</span>
        </button>
        <div class="menu-wrap">
          <button class="btn btn--ghost btn--square" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Altre azioni">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
          </button>
          <div class="menu" id="moreMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-act="theme">Tema chiaro / scuro</button>
            <button type="button" role="menuitem" data-act="discard">Scarta la bozza</button>
            <a role="menuitem" id="exportLink" href="../api/index.php?action=export">Esporta menù (JSON)</a>
            <button type="button" role="menuitem" data-act="import">Importa menù (JSON)</button>
            <button type="button" role="menuitem" data-act="password">Cambia password</button>
            <button type="button" role="menuitem" data-act="logout">Esci</button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </div>
    </header>

    <nav class="tabs" aria-label="Aree del pannello">
      <button class="tab is-active" type="button" data-view="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Menù</span></button>
      <button class="tab" type="button" data-view="allergens"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><span>Allergeni</span></button>
      <button class="tab" type="button" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>Impostazioni</span></button>
      <button class="tab" type="button" data-view="backups"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 7v5l3 2"/></svg><span>Backup</span></button>
    </nav>

    <main class="view" id="view"></main>
  </div>

  <!-- ===== Editor (pannello laterale) ===== -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <header class="sheet__head">
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <button class="btn btn--ghost btn--square" type="button" id="sheetClose" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <form class="sheet__body" id="sheetForm" novalidate></form>
    <footer class="sheet__foot" id="sheetFoot"></footer>
  </aside>

  <!-- ===== Conferme ===== -->
  <dialog class="confirm" id="confirm">
    <form method="dialog">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" value="cancel" type="submit">Annulla</button>
        <button class="btn btn--primary" value="ok" type="submit" id="confirmOk">Conferma</button>
      </div>
    </form>
  </dialog>

  <!-- ===== Selettore immagini ===== -->
  <dialog class="picker" id="picker">
    <header class="picker__head">
      <h3>Scegli un’immagine</h3>
      <div class="picker__tools">
        <label class="btn btn--ghost btn--small">Carica nuova<input type="file" id="pickerUpload" accept="image/png,image/jpeg,image/webp" hidden></label>
        <button class="btn btn--ghost btn--square" type="button" id="pickerClose" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <div class="picker__grid" id="pickerGrid"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>
</html>
